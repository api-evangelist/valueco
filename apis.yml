name: ValueCo
description: ValueCo (ValueCo Metrics SAS) is a Paris-based fintech building an objective
  ESG market view from the proprietary ESG scores of asset managers and institutional
  investors. Its platform aggregates investor-side scoring into a consensus view so
  listed and non-listed companies can understand how the market actually perceives
  their ESG performance and improve their strategies. A Techstars portfolio company,
  ValueCo serves asset managers, institutional investors, enterprises, and ESG contributors;
  it currently publishes no public API or developer program.
